# Cloudflare Pages: static export produced by `npm run build` (next.config.ts sets output: "export"),
# plus Pages Functions in functions/ backed by D1.
name = "mahjong-nanikiru-trainer"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "nanikiru"
database_name = "nanikiru"
database_id = "bf08364c-0f5d-4c25-8946-f9a3abbd083f"
migrations_dir = "migrations"
